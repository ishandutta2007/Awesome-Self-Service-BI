<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Gradient for Accents -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#f43f5e;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#06b6d4;#10b981;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Chart Bar Gradients -->
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="barGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1f2937; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.6; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; letter-spacing: -1px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs -->
  <circle cx="950" cy="180" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="120;160;120" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="250" cy="300" r="160" fill="#0ea5e9" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="150;180;150" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Grid Lines -->
  <g class="grid-line">
    <line x1="100" y1="80" x2="1100" y2="80" />
    <line x1="100" y1="160" x2="1100" y2="160" />
    <line x1="100" y1="240" x2="1100" y2="240" />
    <line x1="100" y1="320" x2="1100" y2="320" />
    <line x1="820" y1="50" x2="820" y2="350" />
    <line x1="900" y1="50" x2="900" y2="350" />
    <line x1="980" y1="50" x2="980" y2="350" />
    <line x1="1060" y1="50" x2="1060" y2="350" />
  </g>

  <!-- Left Side: Typography & Tags -->
  <g transform="translate(80, 75)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="16" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="21" class="badge-pill">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="170" class="title-text">
    Awesome <tspan fill="url(#brandGrad)">Self-Service BI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="215" class="sub-text">
    The modern directory of Self-Service Analytics, Semantic Layers &amp; BI Platforms
  </text>

  <!-- Tag Pills -->
  <g transform="translate(80, 260)">
    <g transform="translate(0, 0)">
      <rect width="130" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">📊 SaaS Leaders</text>
    </g>
    <g transform="translate(142, 0)">
      <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">⚡ Open Source</text>
    </g>
    <g transform="translate(299, 0)">
      <rect width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🧠 Semantic Layers</text>
    </g>
    <g transform="translate(471, 0)">
      <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">💰 Transparent Pricing</text>
    </g>
  </g>

  <!-- Right Side: Dynamic Dashboard Chart Graphic -->
  <g transform="translate(800, 70)">
    <rect width="320" height="260" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />
    
    <circle cx="24" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#eab308" />
    <circle cx="56" cy="22" r="5" fill="#22c55e" />
    <text x="160" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b">ANALYTICS &amp; METRICS</text>
    <line x1="0" y1="42" x2="320" y2="42" stroke="#334155" stroke-width="1" />

    <!-- Animated Data Chart Bars -->
    <rect x="40" y="140" width="36" height="90" rx="6" fill="url(#barGrad1)">
      <animate attributeName="height" values="90;130;70;90" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y" values="140;100;160;140" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="100" y="100" width="36" height="130" rx="6" fill="url(#barGrad2)">
      <animate attributeName="height" values="130;80;150;130" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="100;150;80;100" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <rect x="160" y="80" width="36" height="150" rx="6" fill="url(#barGrad3)">
      <animate attributeName="height" values="150;110;160;150" dur="5s" repeatCount="indefinite" />
      <animate attributeName="y" values="80;120;70;80" dur="5s" repeatCount="indefinite" />
    </rect>
    <rect x="220" y="60" width="36" height="170" rx="6" fill="url(#barGrad4)">
      <animate attributeName="height" values="170;140;180;170" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="60;90;50;60" dur="3.8s" repeatCount="indefinite" />
    </rect>

    <!-- Animated Trend Line -->
    <path d="M 58 140 Q 118 100, 178 80 T 238 60" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)">
      <animate attributeName="d" values="M 58 140 Q 118 100, 178 80 T 238 60; M 58 100 Q 118 150, 178 120 T 238 90; M 58 140 Q 118 100, 178 80 T 238 60" dur="4.5s" repeatCount="indefinite" />
    </path>
    <circle cx="238" cy="60" r="5" fill="#ffffff" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="cy" values="60;90;60" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
